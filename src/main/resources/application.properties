spring.application.name=creditos-backend

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.sender=${MAIL_SENDER}
app.mail.notification-recipient=${MAIL_NOTIFICATION_RECIPIENT}


app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8100,capacitor://localhost,https://localhost,http://localhost,https://fya-creditos-frontend.netlify.app}

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
